<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>0.7 互动验收（独立测试端口）</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../cn.css"><style>body{margin:0}nav{padding:10px;display:flex;flex-wrap:wrap;gap:6px}iframe{display:block;width:100%;height:calc(100vh - 90px);border:0}#status{margin:0 10px;font-size:12px}</style>
<nav id="scenarios" aria-label="测试场景"><button class="ghost" data-age="12" data-id="schoolLetter">12岁 · 同桌来信</button><button class="ghost" data-age="12" data-id="schoolLetter" data-seed="2">12岁 · 同学录</button><button class="ghost" data-age="18" data-id="further">18岁 · 高考</button><button class="ghost" data-age="18" data-id="admission">18岁 · 录取</button><button class="ghost" data-age="15" data-id="zhongkao">15岁 · 志愿表</button><button class="ghost" data-age="18" data-id="major">18岁 · 专业志愿</button><button class="ghost" data-age="35" data-id="arrangements" data-preview="arrangements">35岁 · 生活安排</button><button class="ghost" data-age="35" data-id="adoption_" data-preview="adoption">领养审核</button><button class="ghost" data-age="49" data-id="gift_">升学红包</button><button class="ghost" data-age="64" data-id="grandcare_">退休照护</button><button class="ghost" data-age="22" data-id="jobSearch_">22岁 · 招聘邮件</button><button class="ghost" data-age="25" data-id="social">25岁 · 微信消息</button><button class="ghost" data-age="28" data-id="marriage">28岁 · 签字</button><button class="ghost" data-age="35" data-id="festival">35岁 · 来电</button><button class="ghost" data-age="60" data-id="retirement" data-preview="retirement">60岁 · 养老金</button><button class="ghost" data-age="45" data-id="funeral_" data-preview="funeral">45岁 · 家中来电</button><button class="ghost" id="mobile">手机宽度</button></nav><p id="status">仅在 4180 端口执行，避免覆盖正式预览的存档。</p><iframe id="game" title="测试人生"></iframe>
<script src="../data.js?v=0.7.0"></script><script src="../engine.js?v=0.7.0"></script><script src="../cn-data.js?v=0.7.0"></script><script src="../cn-assets.js?v=0.7.0"></script><script src="../cn-queer.js?v=0.7.0"></script><script src="../cn-economy.js?v=0.7.0"></script>
<script src="../cn-pension.js?v=0.7.0"></script>
<script src="../cn-study.js?v=0.7.0"></script><script src="../cn-finance.js?v=0.7.0"></script><script src="../cn-world.js?v=0.7.0"></script><script src="../cn-education.js?v=0.7.0"></script><script src="../cn-society.js?v=0.7.0"></script><script src="../cn-family.js?v=0.7.0"></script><script src="../cn-city-stories.js?v=0.7.0"></script><script src="../cn-career.js?v=0.7.0"></script><script src="../cn-local.js?v=0.7.0"></script><script src="../cn-engine.js?v=0.7.0"></script>
<script>
if(location.port!=='4180')document.querySelector('#status').textContent='请使用独立的 4180 测试端口。';
document.querySelector('#scenarios').onclick=e=>{const b=e.target.closest('[data-age]');if(!b||location.port!=='4180')return;const age=+b.dataset.age,id=b.dataset.id;let found;
if(b.dataset.preview){found=CNEngine.createLife({seed:1,date:'2026-10-28T12:00:00+08:00'});found.age=age;found.year=found.born.y+age;found.edu.stage='work';found.edu.label='工作待安排';found.savings=50000;if(b.dataset.preview==='arrangements'){found.eduDone='本科';found.income=120000;found.job={title:'企业职员',kind:'college',sector:'private',sinceAge:25,salaryHistory:[120000]};}if(b.dataset.preview==='retirement'){found.done={schoolLife:true,schoolLetter:true,interest:true,homeLetter:true,social:true,career:true,housing:true,care:true};found.eduDone='本科';found.job={title:'基层公共服务岗位',kind:'college',sector:'civil',sinceAge:25,salaryHistory:[120000]};found.income=120000;found.careerYears=35;found.careerIncome=4200000;delete found.pension;CNPension.normalize(found);}if(b.dataset.preview==='funeral'){found.fam.mother.alive=false;found.fam.mother.deathAge=found.fam.mother.age0+age;CNSociety.onParentDeath(found,'mother',()=>{});}if(b.dataset.preview==='adoption'){CNEngine.transact(found,'adopt',{});found.age++;found.year++;}}
for(let seed=+(b.dataset.seed||1);seed<(b.dataset.seed?+b.dataset.seed+1:150)&&!found;seed++){const l=CNEngine.runAuto(CNEngine.createLife({seed,date:'2026-10-27T12:00:00+08:00'}),age);if(!l.alive)continue;for(let n=0;n<20;n++){const d=CNEngine.pendingDecisions(l)[0];if(!d)break;if(d.id===id||id.endsWith('_')&&d.id.startsWith(id)){found=l;break;}CNEngine.resolve(l,d,CNEngine.autoChoice(l,d));}}
if(!found){document.querySelector('#status').textContent='没有找到该场景';return;}found.started=true;const frame=document.querySelector('#game');frame.onload=()=>{frame.onload=null;localStorage.setItem('1incn-v1:auto','false');localStorage.setItem('1incn-v1:current',JSON.stringify(CNEngine.serialize(found)));document.querySelector('#status').textContent=`测试种子 ${found.seed}，${age} 岁，等待 ${id}。`;frame.src='../?interaction-test='+id+'&run='+Date.now();};frame.src='about:blank';};
document.querySelector('#mobile').onclick=()=>{const f=document.querySelector('#game');f.style.width=f.style.width==='390px'?'100%':'390px';f.style.height='844px';};
</script></html>
